name: CI

# The repo shipped a vitest suite and two test files that nothing ever ran.
# Beyond the coverage that buys, this workflow exists to give the branch a
# required status check: `gh pr merge --auto` only arms when a PR has an
# unmet merge requirement, so without one the Dependabot auto-merge rail
# armed only when some third-party check happened to be pending, and errored
# with `Protected branch rules not configured` the rest of the time (PIO-1867).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20" # matches engines.node >=20 in package.json
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test
